<svg viewBox="0 0 380 260" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Ilustración de la Ruta de Aprendizaje DSA">
    <defs>
        <linearGradient id="grad-fondo-ruta" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f172a" />
            <stop offset="100%" stop-color="#1e293b" />
        </linearGradient>
        <linearGradient id="grad-conector" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#0070f3" />
            <stop offset="50%" stop-color="#f59e0b" />
            <stop offset="100%" stop-color="#8b5cf6" />
        </linearGradient>
    </defs>

    <!-- Marco contenedor tipo tarjeta moderna -->
    <rect x="10" y="10" width="360" height="240" rx="14" fill="url(#grad-fondo-ruta)" stroke="#334155" stroke-width="1.5" />

    <!-- Barra de título de la tarjeta -->
    <text x="30" y="38" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" font-weight="700" letter-spacing="1">RUTA PASO A PASO · 3 ETAPAS</text>

    <!-- Línea conectora entre hitos -->
    <line x1="70" y1="105" x2="310" y2="105" stroke="url(#grad-conector)" stroke-width="3" stroke-dasharray="5 5" />
    
    <!-- Flechas sutiles indicadoras de dirección -->
    <polygon points="128,102 135,105 128,108" fill="#f59e0b" />
    <polygon points="248,102 255,105 248,108" fill="#8b5cf6" />

    <!-- ==================== HITO 1: BÁSICO ==================== -->
    <!-- Pill de Nivel -->
    <rect x="36" y="52" width="68" height="20" rx="10" fill="rgba(0, 112, 243, 0.2)" stroke="#0070f3" stroke-width="1" />
    <text x="70" y="66" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="9" font-weight="700" text-anchor="middle">FASE 1</text>

    <!-- Círculo Hito 1 -->
    <circle cx="70" cy="105" r="22" fill="#0070f3" stroke="#ffffff" stroke-width="2.5" />
    <text x="70" y="110" fill="#ffffff" font-family="'Fira Code', monospace" font-size="12" font-weight="bold" text-anchor="middle">01</text>

    <!-- Texto descriptor -->
    <text x="70" y="142" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Básicos</text>
    <text x="70" y="156" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Arreglos &amp; Listas</text>

    <!-- ==================== HITO 2: INTERMEDIO ==================== -->
    <!-- Pill de Nivel -->
    <rect x="156" y="52" width="68" height="20" rx="10" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" stroke-width="1" />
    <text x="190" y="66" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="9" font-weight="700" text-anchor="middle">FASE 2</text>

    <!-- Círculo Hito 2 -->
    <circle cx="190" cy="105" r="22" fill="#f59e0b" stroke="#ffffff" stroke-width="2.5" />
    <text x="190" y="110" fill="#ffffff" font-family="'Fira Code', monospace" font-size="12" font-weight="bold" text-anchor="middle">02</text>

    <!-- Texto descriptor -->
    <text x="190" y="142" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Intermedio</text>
    <text x="190" y="156" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Búsqueda &amp; Hash</text>

    <!-- ==================== HITO 3: AVANZADO ==================== -->
    <!-- Pill de Nivel -->
    <rect x="276" y="52" width="68" height="20" rx="10" fill="rgba(139, 92, 246, 0.2)" stroke="#8b5cf6" stroke-width="1" />
    <text x="310" y="66" fill="#c084fc" font-family="'Inter', sans-serif" font-size="9" font-weight="700" text-anchor="middle">FASE 3</text>

    <!-- Círculo Hito 3 -->
    <circle cx="310" cy="105" r="22" fill="#8b5cf6" stroke="#ffffff" stroke-width="2.5" />
    <text x="310" y="110" fill="#ffffff" font-family="'Fira Code', monospace" font-size="12" font-weight="bold" text-anchor="middle">03</text>

    <!-- Texto descriptor -->
    <text x="310" y="142" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Avanzado</text>
    <text x="310" y="156" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Árboles &amp; Grafos</text>

    <!-- ==================== FOOTER CARD INFERIOR ==================== -->
    <rect x="25" y="180" width="330" height="52" rx="8" fill="#0b1329" stroke="#1e293b" stroke-width="1" />
    
    <!-- Indicador verde de meta -->
    <circle cx="45" cy="206" r="6" fill="#10b981" />
    <text x="60" y="203" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Meta: Dominio Técnico de Algoritmos</text>
    <text x="60" y="218" fill="#64748b" font-family="'Fira Code', monospace" font-size="9">12 temas · Complejidad O(1) hasta O(V+E) &amp; DP</text>

    <!-- Insignia check -->
    <rect x="305" y="193" width="36" height="26" rx="6" fill="#0070f3" />
    <text x="323" y="210" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">100%</text>
</svg>
