<svg viewBox="0 0 380 280" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Gráfica de curvas de complejidad Big O">
    <defs>
        <filter id="glow-bigo" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Ejes de coordenadas -->
    <line x1="50" y1="230" x2="350" y2="230" stroke="#64748b" stroke-opacity="0.4" stroke-width="2" />
    <line x1="50" y1="230" x2="50" y2="30" stroke="#64748b" stroke-opacity="0.4" stroke-width="2" />
    
    <!-- Flechas de los ejes -->
    <polygon points="350,226 358,230 350,234" fill="#64748b" fill-opacity="0.6" />
    <polygon points="46,30 50,22 54,30" fill="#64748b" fill-opacity="0.6" />

    <!-- Etiquetas de los ejes -->
    <text x="350" y="250" fill="#64748b" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="end">Tamaño de Entrada (N) →</text>
    <text x="45" y="20" fill="#64748b" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="start">↑ Operaciones / Tiempo</text>

    <!-- Curva O(1) - Excelente (Verde) -->
    <line x1="50" y1="210" x2="340" y2="210" stroke="#10b981" stroke-width="3" />
    <text x="345" y="214" fill="#10b981" font-family="'Fira Code', monospace" font-size="11" font-weight="bold">O(1)</text>

    <!-- Curva O(log n) - Buena (Cian) -->
    <path d="M 50 210 Q 150 190 340 180" fill="none" stroke="#06b6d4" stroke-width="3" />
    <text x="345" y="184" fill="#06b6d4" font-family="'Fira Code', monospace" font-size="11" font-weight="bold">O(log n)</text>

    <!-- Curva O(n) - Aceptable (Amarillo) -->
    <line x1="50" y1="210" x2="330" y2="120" stroke="#eab308" stroke-width="3" />
    <text x="335" y="124" fill="#eab308" font-family="'Fira Code', monospace" font-size="11" font-weight="bold">O(n)</text>

    <!-- Curva O(n log n) - Regular (Naranja) -->
    <path d="M 50 210 Q 180 180 300 70" fill="none" stroke="#f97316" stroke-width="3" />
    <text x="305" y="68" fill="#f97316" font-family="'Fira Code', monospace" font-size="11" font-weight="bold">O(n log n)</text>

    <!-- Curva O(n^2) - Mala (Rojo) -->
    <path d="M 50 210 Q 150 200 200 40" fill="none" stroke="#ef4444" stroke-width="3" />
    <text x="205" y="45" fill="#ef4444" font-family="'Fira Code', monospace" font-size="11" font-weight="bold">O(n²)</text>

    <!-- Curva O(2^n) - Horrible (Morado brillante) -->
    <path d="M 50 210 Q 100 205 120 40" fill="none" stroke="#a855f7" stroke-width="3.5" filter="url(#glow-bigo)" />
    <text x="125" y="45" fill="#a855f7" font-family="'Fira Code', monospace" font-size="11" font-weight="bold">O(2ⁿ)</text>
</svg>
