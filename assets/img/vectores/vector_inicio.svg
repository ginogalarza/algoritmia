<svg viewBox="0 0 400 320" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Ilustración de grafo y árbol binario">
    <defs>
        <linearGradient id="grad-nodo" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0070f3" />
            <stop offset="100%" stop-color="#7928ca" />
        </linearGradient>
        <linearGradient id="grad-linea" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00dfd8" />
            <stop offset="100%" stop-color="#0070f3" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <line x1="200" y1="50" x2="100" y2="140" stroke="url(#grad-linea)" stroke-width="3" stroke-dasharray="4 4" />
    <line x1="200" y1="50" x2="300" y2="140" stroke="url(#grad-linea)" stroke-width="3" stroke-dasharray="4 4" />
    <line x1="100" y1="140" x2="50" y2="240" stroke="url(#grad-linea)" stroke-width="2.5" />
    <line x1="100" y1="140" x2="150" y2="240" stroke="url(#grad-linea)" stroke-width="2.5" />
    <line x1="300" y1="140" x2="250" y2="240" stroke="url(#grad-linea)" stroke-width="2.5" />
    <line x1="300" y1="140" x2="350" y2="240" stroke="url(#grad-linea)" stroke-width="2.5" />

    <g filter="url(#glow)">
        <circle cx="200" cy="50" r="26" fill="url(#grad-nodo)" stroke="#ffffff" stroke-width="2" />
        <text x="200" y="55" fill="#ffffff" font-family="'Fira Code', monospace" font-size="13" font-weight="bold" text-anchor="middle">Root</text>
    </g>

    <g>
        <circle cx="100" cy="140" r="22" fill="#0070f3" stroke="#ffffff" stroke-width="2" />
        <text x="100" y="145" fill="#ffffff" font-family="'Fira Code', monospace" font-size="12" font-weight="bold" text-anchor="middle">L-1</text>
    </g>
    <g>
        <circle cx="300" cy="140" r="22" fill="#7928ca" stroke="#ffffff" stroke-width="2" />
        <text x="300" y="145" fill="#ffffff" font-family="'Fira Code', monospace" font-size="12" font-weight="bold" text-anchor="middle">R-1</text>
    </g>

    <circle cx="50" cy="240" r="18" fill="#0ea5e9" stroke="#ffffff" stroke-width="1.5" />
    <text x="50" y="244" fill="#ffffff" font-family="'Fira Code', monospace" font-size="10" font-weight="bold" text-anchor="middle">L-2A</text>

    <circle cx="150" cy="240" r="18" fill="#0ea5e9" stroke="#ffffff" stroke-width="1.5" />
    <text x="150" y="244" fill="#ffffff" font-family="'Fira Code', monospace" font-size="10" font-weight="bold" text-anchor="middle">L-2B</text>

    <circle cx="250" cy="240" r="18" fill="#a855f7" stroke="#ffffff" stroke-width="1.5" />
    <text x="250" y="244" fill="#ffffff" font-family="'Fira Code', monospace" font-size="10" font-weight="bold" text-anchor="middle">R-2A</text>

    <circle cx="350" cy="240" r="18" fill="#a855f7" stroke="#ffffff" stroke-width="1.5" />
    <text x="350" y="244" fill="#ffffff" font-family="'Fira Code', monospace" font-size="10" font-weight="bold" text-anchor="middle">R-2B</text>

    <rect x="140" y="280" width="120" height="28" rx="14" fill="#111827" stroke="#0070f3" stroke-width="1.5" />
    <text x="200" y="298" fill="#00e5ff" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" text-anchor="middle">BST: O(log n)</text>
</svg>
